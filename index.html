<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smileat · Monthly Advertising Performance Report · Octubre 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <img class="logo" src="assets/logo-smileat.png" alt="Smileat">
    <p class="tagline">Alimentación infantil ecológica, <strong>tan real</strong> como tu peque</p>
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </header>

  <nav class="report-nav">
    <a href="#mimo">MIMO</a>
    <a href="#meta">Meta Ads</a>
    <a href="#google">Google Ads</a>
  </nav>

  <!-- ==================== MIMO (compartido Meta + Google) ==================== -->
  <section class="section" id="mimo">
    <h2>MIMO del próximo mes</h2>
    <p class="section-sub" id="mimo-sub"></p>
    <div class="mimo-grid" id="mimo-grid"></div>
  </section>

  <!-- ==================== META ADS ==================== -->
  <section class="section" id="meta">
    <h2>Meta Ads</h2>
    <p class="section-sub" id="meta-sub"></p>

    <div class="kpi-group">
      <p class="kpi-group-label" id="meta-ecommerce-label"></p>
      <div class="kpi-bar" id="meta-kpis-ecommerce"></div>
    </div>
    <div class="kpi-group">
      <p class="kpi-group-label" id="meta-marca-label"></p>
      <div class="kpi-bar" id="meta-kpis-marca"></div>
    </div>
    <p class="nota" id="meta-nota"></p>

    <div class="conclusiones" id="meta-conclusiones"></div>
  </section>

  <!-- ==================== GOOGLE ADS ==================== -->
  <section class="section" id="google">
    <h2>Google Ads</h2>
    <p class="section-sub" id="google-sub"></p>
    <div class="kpi-bar" id="google-kpis"></div>
    <p class="nota" id="google-nota"></p>
    <div class="conclusiones" id="google-conclusiones"></div>
  </section>

  <footer>
    <span class="footer-title">Smileat · Monthly Advertising Performance Report</span>
    <span class="footer-contact">Contacto: <a href="mailto:noelia.nieto@smileat.com">noelia.nieto@smileat.com</a></span>
  </footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
